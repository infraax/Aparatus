[workspace]
members = [
    "crates/apparatus-types",
    "crates/apparatus-time",
    "crates/apparatus-crypto",
    "crates/apparatus-schema",
    "crates/apparatus-store",
    "crates/apparatus-artifacts",
    "crates/apparatus-ledger",
    "crates/apparatus-kernel",
    "crates/apparatus-ic",
    "crates/apparatus-quarantine",
    "bins/apparatus-cli",
    "bins/apparatusd"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Apparatus Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
uuid = { version = "1.8", features = ["v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
blake3 = { version = "1.8", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.4"
